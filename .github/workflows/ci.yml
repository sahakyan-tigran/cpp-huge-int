name: tests

on:
  push:
  pull_request:
  workflow_dispatch:        # adds the "Run workflow" button on the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test suite
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -I. tests/test_hugeint.cpp HugeInt.cpp -o test_hugeint
          ./test_hugeint

  makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make clean
